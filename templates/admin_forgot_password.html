<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
</head>
<body>

    <h2>Forgot Password</h2>

    <p>Enter your admin email address to reset your password.</p>

    <form method="POST">
        {% csrf_token %}

        <label>Email</label>
        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">
            Send Reset Link
        </button>
    </form>

</body>
</html>
