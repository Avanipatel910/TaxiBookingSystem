```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password | TaxiGo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">
<div class="card border-0 shadow p-4" style="max-width:420px;width:100%;border-radius:18px">
    <h2 class="fw-bold mb-2">Create a new password</h2>
    <p class="text-secondary">Choose a strong password with at least 8 characters.</p>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label for="password" class="form-label fw-semibold">New password</label>
        <input id="password" name="password" type="password"
               minlength="8" autocomplete="new-password"
               class="form-control mb-3" required>

        <label for="confirm_password" class="form-label fw-semibold">Confirm password</label>
        <input id="confirm_password" name="confirm_password" type="password"
               minlength="8" autocomplete="new-password"
               class="form-control mb-3" required>

        <button class="btn btn-primary w-100">Reset password</button>
    </form>
</div>
</body>
</html>
```
