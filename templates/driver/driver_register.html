<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Driver Registration | Taxi Booking</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(7, 15, 30, 0.82),
                    rgba(7, 15, 30, 0.88)
                ),
                url("https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=1920&q=85")
                center/cover no-repeat;

            padding: 50px 15px;
        }

        .registration-wrapper {
            max-width: 900px;
            margin: auto;
        }

        .registration-card {
            overflow: hidden;

            background: rgba(255, 255, 255, 0.97);

            border-radius: 24px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.35);
        }

        .registration-header {
            padding: 38px 40px;

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #1f2937
                );

            color: white;
        }

        .driver-icon {
            width: 64px;
            height: 64px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background: rgba(255, 255, 255, 0.12);

            font-size: 28px;

            margin-bottom: 18px;
        }

        .registration-header h1 {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .registration-header p {
            margin: 0;
            color: #d1d5db;
        }

        .registration-body {
            padding: 40px;
        }

        .form-label {
            font-weight: 600;
            color: #1f2937;
        }

        .form-control {
            min-height: 52px;

            border-radius: 12px;
            border: 1px solid #d1d5db;

            padding: 12px 15px;
        }

        .form-control:focus {
            border-color: #111827;

            box-shadow:
                0 0 0 0.2rem rgba(17, 24, 39, 0.10);
        }

        .input-group .form-control {
            border-radius: 12px 0 0 12px;
        }

        .input-group .btn {
            border-radius: 0 12px 12px 0;
        }

        .register-btn {
            min-height: 54px;

            border: none;
            border-radius: 12px;

            background: #111827;
            color: white;

            font-weight: 600;
            font-size: 16px;
        }

        .register-btn:hover {
            background: #000;
            color: white;
        }

        .login-link {
            color: #111827;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        .info-box {
            padding: 15px 18px;

            border-radius: 12px;

            background: #f3f4f6;

            color: #4b5563;

            font-size: 14px;
        }

        @media (max-width: 576px) {

            body {
                padding: 20px 12px;
            }

            .registration-header,
            .registration-body {
                padding: 28px 22px;
            }

            .registration-header h1 {
                font-size: 25px;
            }

        }

    </style>

</head>

<body>

<div class="registration-wrapper">

    <div class="registration-card">

        <!-- Header -->

        <div class="registration-header">

            <div class="driver-icon">
                <i class="bi bi-person-vcard"></i>
            </div>

            <h1>Driver Registration</h1>

            <p>
                Join our driver network and start accepting taxi bookings.
            </p>

        </div>


        <!-- Form -->

        <div class="registration-body">

            {% if error %}

                <div class="alert alert-danger d-flex align-items-center mb-4">

                    <i class="bi bi-exclamation-circle me-2"></i>

                    <span>{{ error }}</span>

                </div>

            {% endif %}


            {% if success %}

                <div class="alert alert-success d-flex align-items-center mb-4">

                    <i class="bi bi-check-circle me-2"></i>

                    <span>{{ success }}</span>

                </div>

            {% endif %}


            <div class="info-box mb-4">

                <i class="bi bi-shield-check me-2"></i>

                Please provide accurate personal and driving-license
                information for verification.

            </div>


            <form method="POST">

                {% csrf_token %}


                <div class="row g-4">


                    <!-- Name -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Full Name
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                placeholder="Enter full name"
                                value="{{ name|default:'' }}"
                                maxlength="100"
                                required
                            >

                        </div>

                    </div>


                    <!-- Email -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Email Address
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter email address"
                                value="{{ email|default:'' }}"
                                required
                            >

                        </div>

                    </div>


                    <!-- License -->

                    <div class="col-md-6">

                        <label class="form-label">
                            License Number
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-card-text"></i>
                            </span>

                            <input
                                type="text"
                                name="license_number"
                                class="form-control"
                                placeholder="Enter license number"
                                value="{{ license_number|default:'' }}"
                                maxlength="50"
                                required
                            >

                        </div>

                    </div>


                    <!-- Phone -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Phone Number
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-phone"></i>
                            </span>

                            <input
                                type="tel"
                                name="phone"
                                class="form-control"
                                placeholder="Enter phone number"
                                value="{{ phone|default:'' }}"
                                maxlength="15"
                                required
                            >

                        </div>

                    </div>


                    <!-- Password -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Password
                        </label>

                        <div class="input-group">

                            <input
                                type="password"
                                name="password"
                                id="password"
                                class="form-control"
                                placeholder="Create password"
                                required
                            >

                            <button
                                type="button"
                                class="btn btn-outline-secondary"
                                onclick="togglePassword('password', this)"
                            >
                                <i class="bi bi-eye"></i>
                            </button>

                        </div>

                    </div>


                    <!-- Confirm Password -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Confirm Password
                        </label>

                        <div class="input-group">

                            <input
                                type="password"
                                name="confirm_password"
                                id="confirm_password"
                                class="form-control"
                                placeholder="Confirm password"
                                required
                            >

                            <button
                                type="button"
                                class="btn btn-outline-secondary"
                                onclick="togglePassword('confirm_password', this)"
                            >
                                <i class="bi bi-eye"></i>
                            </button>

                        </div>

                    </div>


                    <!-- Submit -->

                    <div class="col-12 mt-2">

                        <button
                            type="submit"
                            class="btn register-btn w-100"
                        >

                            <i class="bi bi-person-plus me-2"></i>

                            Create Driver Account

                        </button>

                    </div>

                </div>

            </form>


            <div class="text-center mt-4">

                <span class="text-muted">
                    Already registered?
                </span>

                <a
                    href="{% url 'user_login' %}"
                    class="login-link ms-1"
                >
                    Login
                </a>

            </div>

        </div>

    </div>

</div>


<script>

function togglePassword(inputId, button) {

    const input = document.getElementById(inputId);
    const icon = button.querySelector("i");

    if (input.type === "password") {

        input.type = "text";

        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");

    } else {

        input.type = "password";

        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");

    }

}

</script>

</body>

</html>
