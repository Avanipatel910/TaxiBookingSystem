```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify OTP | TaxiGo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">
<div class="card border-0 shadow p-4" style="max-width:420px;width:100%;border-radius:18px">
    <h2 class="fw-bold mb-2">Verify your email</h2>
    <p class="text-secondary">Enter the six-digit code sent to your registered email. It expires in 5 minutes.</p>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label for="otp" class="form-label fw-semibold">Verification code</label>
        <input id="otp" name="otp" type="text" inputmode="numeric"
               pattern="[0-9]{6}" maxlength="6" class="form-control mb-3"
               placeholder="Enter 6-digit OTP" required>
        <button class="btn btn-primary w-100">Verify OTP</button>
    </form>

    <a class="text-center mt-3 text-decoration-none"
       href="{% url 'driver_forgot_password' %}">Request another code</a>
</div>
</body>
</html>
```
