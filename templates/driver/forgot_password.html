```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password | TaxiGo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #111827, #1d4ed8);
        }
        .reset-card {
            width: 100%;
            max-width: 440px;
            background: #fff;
            border-radius: 22px;
            padding: 38px;
            box-shadow: 0 25px 70px rgba(0,0,0,.22);
        }
        .icon-box {
            width: 65px;
            height: 65px;
            display: grid;
            place-items: center;
            margin-bottom: 24px;
            border-radius: 18px;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 30px;
        }
        h1 { font-weight: 800; font-size: 27px; }
        .subtitle { color: #6b7280; line-height: 1.7; }
        .form-control {
            padding: 13px 14px;
            border-radius: 10px;
        }
        .btn-primary {
            padding: 13px;
            border-radius: 10px;
            font-weight: 700;
            background: #2563eb;
        }
        .back-link {
            display: inline-block;
            margin-top: 22px;
            color: #4b5563;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { color: #2563eb; }
    </style>
</head>
<body>
<div class="reset-card">
    <div class="icon-box">
        <i class="bi bi-shield-lock"></i>
    </div>

    <h1>Forgot password?</h1>
    <p class="subtitle mb-4">
        No worries. Enter the email address registered to your driver
        account and we'll send you a verification code.
    </p>

    {% if error %}
    <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label for="email" class="form-label fw-semibold">Email address</label>
        <input
            type="email"
            class="form-control mb-4"
            id="email"
            name="email"
            placeholder="driver@example.com"
            value="{{ email|default:'' }}"
            autocomplete="email"
            required
        >

        <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-envelope me-2"></i>Send verification code
        </button>
    </form>

    <div class="text-center">
        <a href="{% url 'driver_login' %}" class="back-link">
            <i class="bi bi-arrow-left me-1"></i> Back to driver login
        </a>
    </div>
</div>
</body>
</html>
```
