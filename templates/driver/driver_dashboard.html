
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Driver Dashboard | Taxi Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #f3f6fa;
            color: #1e293b;
            font-family: Arial, sans-serif;
        }
        .topbar {
            background: #142536;
            color: #fff;
            padding: 18px 5%;
        }
        .dashboard {
            max-width: 1050px;
            margin: 45px auto;
            padding: 0 20px;
        }
        .welcome-card {
            padding: 32px;
            color: #fff;
            background: linear-gradient(120deg, #12677a, #183e59);
            border-radius: 20px;
        }
        .info-card {
            height: 100%;
            padding: 24px;
            background: #fff;
            border: 1px solid #e6ebf1;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(20, 37, 54, .04);
        }
        .info-icon {
            display: inline-grid;
            width: 44px;
            height: 44px;
            place-items: center;
            margin-bottom: 16px;
            color: #12677a;
            background: #e5f5f7;
            border-radius: 12px;
            font-size: 21px;
        }
        .logout-btn {
            color: #fff;
            border: 1px solid #8293a3;
        }
        .logout-btn:hover {
            color: #142536;
            background: #fff;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="fw-bold fs-5">
                <i class="bi bi-taxi-front-fill me-2"></i>
                Taxi Booking
            </div>
            <a href="{% url 'driver_logout' %}"
               class="btn logout-btn btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i>
                Logout
            </a>
        </div>
    </header>

    <main class="dashboard">
        <section class="welcome-card mb-4">
            <p class="text-white-50 mb-2">DRIVER PORTAL</p>
            <h1 class="fw-bold">
                Welcome, {{ driver.name }}!
            </h1>
            <p class="mb-0">
                You are successfully signed in to your driver account.
            </p>
        </section>

        <h4 class="fw-bold mb-3">Your Account</h4>

        <div class="row g-3">
            <div class="col-md-6">
                <section class="info-card">
                    <div class="info-icon">
                        <i class="bi bi-person"></i>
                    </div>
                    <h6 class="text-secondary">Full Name</h6>
                    <p class="fs-5 fw-semibold mb-0">{{ driver.name }}</p>
                </section>
            </div>

            <div class="col-md-6">
                <section class="info-card">
                    <div class="info-icon">
                        <i class="bi bi-envelope"></i>
                    </div>
                    <h6 class="text-secondary">Email Address</h6>
                    <p class="fw-semibold mb-0">{{ driver.email }}</p>
                </section>
            </div>

            <div class="col-md-6">
                <section class="info-card">
                    <div class="info-icon">
                        <i class="bi bi-card-text"></i>
                    </div>
                    <h6 class="text-secondary">License Number</h6>
                    <p class="fw-semibold mb-0">
                        {{ driver.license_number }}
                    </p>
                </section>
            </div>

            <div class="col-md-6">
                <section class="info-card">
                    <div class="info-icon">
                        <i class="bi bi-telephone"></i>
                    </div>
                    <h6 class="text-secondary">Phone Number</h6>
                    <p class="fw-semibold mb-0">{{ driver.mobile }}</p>
                </section>
            </div>
        </div>
    </main>
</body>
</html>
