
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Driver Login | Taxi Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #101827, #174c65);
            font-family: Arial, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 38px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 24px 65px rgba(0, 0, 0, .25);
        }
        .icon-box {
            width: 64px;
            height: 64px;
            display: grid;
            place-items: center;
            margin: 0 auto 18px;
            color: #fff;
            background: #147d92;
            border-radius: 18px;
            font-size: 28px;
        }
        .form-control {
            padding: 12px 14px;
            border-radius: 10px;
        }
        .btn-login {
            padding: 12px;
            color: #fff;
            background: #147d92;
            border: 0;
            border-radius: 10px;
            font-weight: 600;
        }
        .btn-login:hover {
            color: #fff;
            background: #105f70;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="icon-box">
            <i class="bi bi-taxi-front-fill"></i>
        </div>

        <div class="text-center mb-4">
            <h2 class="fw-bold">Driver Login</h2>
            <p class="text-secondary mb-0">
                Sign in to access your driver account.
            </p>
        </div>

        {% if error %}
            <div class="alert alert-danger" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">
                    Email address
                </label>
                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    value="{{ email|default:'' }}"
                    placeholder="driver@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">
                    Password
                </label>
                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-login w-100">
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Sign In
            </button>
        </form>

        <p class="text-center text-secondary mt-4 mb-0">
            Not registered as a driver?
            <a href="{% url 'driver_register' %}"
               class="text-decoration-none fw-semibold">
                Register here
            </a>
        </p>

        <div class="text-center mt-3">
            <a href="{% url 'user_login' %}"
               class="text-decoration-none small">
                Back to customer login
            </a>
        </div>
    </main>
</body>
</html>
