{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Taxi Booking</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(10, 18, 35, 0.84),
                    rgba(10, 18, 35, 0.84)
                ),
                url("https://images.unsplash.com/photo-1519003722824-194d4455a60c?auto=format&fit=crop&w=1920&q=85")
                center/cover no-repeat;
        }

        .reset-card {
            width: 100%;
            max-width: 450px;
            padding: 40px;

            background: rgba(255, 255, 255, 0.97);

            border-radius: 22px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.30);
        }

        .icon-box {
            width: 72px;
            height: 72px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background: #111827;
            color: #ffffff;

            font-size: 30px;
        }

        .form-control {
            height: 52px;

            border-radius: 12px;
            border: 1px solid #d1d5db;
        }

        .form-control:focus {
            border-color: #111827;

            box-shadow:
                0 0 0 0.2rem rgba(17, 24, 39, 0.12);
        }

        .reset-btn {
            height: 52px;

            border: none;
            border-radius: 12px;

            background: #111827;
            color: white;

            font-weight: 600;
        }

        .reset-btn:hover {
            background: #000000;
            color: white;
        }

        .security-note {
            font-size: 13px;
            color: #6b7280;
        }

    </style>

</head>

<body>

<div class="reset-card">

    <div class="icon-box">
        <i class="bi bi-lock"></i>
    </div>

    <div class="text-center mb-4">

        <h2 class="fw-bold mb-2">
            Reset Password
        </h2>

        <p class="text-muted mb-0">
            Create a new password for your account.
        </p>

    </div>


    {% if error %}

        <div class="alert alert-danger d-flex align-items-center">

            <i class="bi bi-exclamation-circle me-2"></i>

            <span>{{ error }}</span>

        </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <div class="mb-3">

            <label class="form-label fw-semibold">
                New Password
            </label>

            <div class="input-group">

                <input
                    type="password"
                    name="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter new password"
                    required
                >

                <button
                    type="button"
                    class="btn btn-outline-secondary"
                    onclick="togglePassword('password', this)"
                >
                    <i class="bi bi-eye"></i>
                </button>

            </div>

        </div>


        <div class="mb-4">

            <label class="form-label fw-semibold">
                Confirm New Password
            </label>

            <div class="input-group">

                <input
                    type="password"
                    name="confirm_password"
                    id="confirm_password"
                    class="form-control"
                    placeholder="Confirm new password"
                    required
                >

                <button
                    type="button"
                    class="btn btn-outline-secondary"
                    onclick="togglePassword('confirm_password', this)"
                >
                    <i class="bi bi-eye"></i>
                </button>

            </div>

        </div>


        <button
            type="submit"
            class="btn reset-btn w-100"
        >
            <i class="bi bi-check-circle me-2"></i>
            Reset Password
        </button>

    </form>


    <div class="text-center mt-4">

        <div class="security-note">

            <i class="bi bi-shield-check me-1"></i>

            Your password will be securely encrypted.

        </div>

    </div>

</div>


<script>

function togglePassword(inputId, button) {

    const input = document.getElementById(inputId);
    const icon = button.querySelector('i');

    if (input.type === 'password') {

        input.type = 'text';

        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');

    } else {

        input.type = 'password';

        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');

    }

}

</script>

</body>

</html>
