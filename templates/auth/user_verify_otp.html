{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP | Taxi Booking</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(rgba(10, 18, 35, 0.82), rgba(10, 18, 35, 0.82)),
                url("https://images.unsplash.com/photo-1519003722824-194d4455a60c?auto=format&fit=crop&w=1920&q=85")
                center/cover no-repeat;
        }

        .otp-card {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 22px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.30);
        }

        .icon-box {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: #111827;
            color: #fff;
            font-size: 30px;
        }

        .otp-input {
            height: 58px;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 8px;
            border-radius: 12px;
        }

        .otp-input:focus {
            border-color: #111827;
            box-shadow: 0 0 0 0.2rem rgba(17, 24, 39, 0.12);
        }

        .verify-btn {
            height: 52px;
            border: none;
            border-radius: 12px;
            background: #111827;
            color: white;
            font-weight: 600;
        }

        .verify-btn:hover {
            background: #000;
            color: white;
        }

        .back-link {
            text-decoration: none;
            color: #6b7280;
            font-size: 14px;
        }

        .back-link:hover {
            color: #111827;
        }
    </style>
</head>

<body>

<div class="otp-card">

    <div class="icon-box">
        <i class="bi bi-shield-lock"></i>
    </div>

    <div class="text-center">

        <h2 class="fw-bold mb-2">
            Verify OTP
        </h2>

        <p class="text-muted mb-4">
            Enter the 6-digit OTP sent to your email address.
        </p>

    </div>

    {% if error %}
        <div class="alert alert-danger d-flex align-items-center">
            <i class="bi bi-exclamation-circle me-2"></i>
            <span>{{ error }}</span>
        </div>
    {% endif %}

    {% if email %}
        <div class="text-center mb-3">
            <small class="text-muted">
                OTP sent to
            </small>
            <div class="fw-semibold">
                {{ email }}
            </div>
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="mb-4">

            <label class="form-label fw-semibold">
                Enter OTP
            </label>

            <input
                type="text"
                name="otp"
                class="form-control otp-input"
                maxlength="6"
                minlength="6"
                pattern="[0-9]{6}"
                inputmode="numeric"
                autocomplete="one-time-code"
                placeholder="••••••"
                required
            >

        </div>

        <button type="submit" class="btn verify-btn w-100">
            <i class="bi bi-check-circle me-2"></i>
            Verify OTP
        </button>

    </form>

    <div class="text-center mt-4">

        <a href="{% url 'user_forgot_password' %}" class="back-link">
            <i class="bi bi-arrow-left me-1"></i>
            Back to Forgot Password
        </a>

    </div>

</div>

</body>
</html>
