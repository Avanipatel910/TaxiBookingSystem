<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Taxi Booking System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .navbar {
            background: #1e293b;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .logout {
            background: #facc15;
            color: #1e293b;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .container {
            padding: 40px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            margin-bottom: 8px;
        }

        .welcome p {
            color: #64748b;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            margin-bottom: 12px;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
            color: #eab308;
        }

        @media (max-width: 768px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>🚕 Taxi Booking System</h2>

        <a href="{% url 'admin_logout' %}" class="logout">
            Logout
        </a>
    </div>

    <div class="container">

        <div class="welcome">
            <h1>Welcome, {{ request.user.username }}</h1>
            <p>Admin Dashboard</p>
        </div>

        <div class="cards">

            <div class="card">
                <h3>Total Customers</h3>
                <div class="number">0</div>
            </div>

            <div class="card">
                <h3>Total Drivers</h3>
                <div class="number">0</div>
            </div>

            <div class="card">
                <h3>Total Bookings</h3>
                <div class="number">0</div>
            </div>

        </div>

    </div>

</body>
</html>
