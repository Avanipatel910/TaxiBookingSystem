

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Taxi Booking System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;

            background: #f1f5f9;

            color: #1e293b;
        }


        /* =========================
           Dashboard Layout
        ========================= */

        .dashboard-layout {
            display: flex;

            min-height: calc(100vh - 70px);
        }


        /* =========================
           Sidebar
        ========================= */

        .dashboard-sidebar {
            width: 250px;

            flex-shrink: 0;
        }


        /* =========================
           Main Content
        ========================= */

        .dashboard-content {
            flex: 1;

            padding: 35px;

            min-width: 0;
        }


        /* =========================
           Welcome Section
        ========================= */

        .welcome-section {
            margin-bottom: 30px;
        }


        .welcome-section h1 {
            font-size: 28px;

            margin-bottom: 8px;

            color: #1e293b;
        }


        .welcome-section p {
            color: #64748b;

            font-size: 15px;
        }


        /* =========================
           Dashboard Cards
        ========================= */

        .dashboard-cards {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 22px;
        }


        .dashboard-card {
            background: #ffffff;

            padding: 25px;

            border-radius: 14px;

            border: 1px solid #e8edf3;

            box-shadow:
                0 6px 20px rgba(0, 0, 0, 0.05);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .dashboard-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.08);
        }


        /* =========================
           Card Header
        ========================= */

        .card-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 18px;
        }


        .card-header h3 {
            font-size: 15px;

            font-weight: 600;

            color: #475569;
        }


        .card-icon {
            width: 42px;

            height: 42px;

            border-radius: 10px;

            background: #fff7d9;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 20px;
        }


        /* =========================
           Numbers
        ========================= */

        .card-number {
            font-size: 34px;

            font-weight: 700;

            color: #eab308;

            line-height: 1;
        }


        .card-description {
            margin-top: 10px;

            font-size: 12px;

            color: #94a3b8;
        }


        /* =========================
           Responsive
        ========================= */

        @media (max-width: 900px) {

            .dashboard-sidebar {
                width: 210px;
            }


            .dashboard-cards {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }


            .dashboard-content {
                padding: 25px;
            }

        }


        @media (max-width: 700px) {

            .dashboard-layout {
                min-height: calc(100vh - 65px);
            }


            .dashboard-sidebar {
                width: 70px;
            }


            .dashboard-content {
                padding: 20px;
            }


            .dashboard-cards {
                grid-template-columns: 1fr;
            }


            .welcome-section h1 {
                font-size: 23px;
            }

        }


        @media (max-width: 400px) {

            .dashboard-content {
                padding: 15px;
            }

        }

    </style>

</head>


<body>
{% include 'includes/navbar.html' %}
    <div class="dashboard-layout">

        <!-- =========================
             Sidebar
        ========================= -->

        <div class="dashboard-sidebar">

            {% include 'includes/admin_sidebar.html' %}

        </div>


        <!-- =========================
             Main Content
        ========================= -->

        <main class="dashboard-content">


            <!-- Welcome -->

            <section class="welcome-section">

                <h1>
                    Welcome, {{ request.user.username }}
                </h1>

                <p>
                    Here's an overview of your Taxi Booking System.
                </p>

            </section>


            <!-- Dashboard Cards -->

            <section class="dashboard-cards">


                <!-- Customers -->

                <div class="dashboard-card">

                    <div class="card-header">

                        <h3>
                            Total Customers
                        </h3>

                        <div class="card-icon">
                            👥
                        </div>

                    </div>

                    <div class="card-number">
                        0
                    </div>

                    <div class="card-description">
                        Registered customers
                    </div>

                </div>


                <!-- Drivers -->

                <div class="dashboard-card">

                    <div class="card-header">

                        <h3>
                            Total Drivers
                        </h3>

                        <div class="card-icon">
                            🚗
                        </div>

                    </div>

                    <div class="card-number">
                        0
                    </div>

                    <div class="card-description">
                        Registered drivers
                    </div>

                </div>


                <!-- Bookings -->

                <div class="dashboard-card">

                    <div class="card-header">

                        <h3>
                            Total Bookings
                        </h3>

                        <div class="card-icon">
                            📋
                        </div>

                    </div>

                    <div class="card-number">
                        0
                    </div>

                    <div class="card-description">
                        Total taxi bookings
                    </div>

                </div>


            </section>

        </main>

    </div>

</body>

</html>
