<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Taxi Booking System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .navbar {
            background: #1e293b;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .logout {
            color: #1e293b;
            background: #facc15;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .container {
            padding: 50px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>🚕 Taxi Booking System</h2>

        <a href="{% url 'admin_logout' %}" class="logout">
            Logout
        </a>
    </div>

    <div class="container">
        <div class="card">
            <h1>Welcome, {{ request.user.username }}</h1>
            <p>You are successfully logged in as an administrator.</p>
        </div>
    </div>

</body>
</html>
