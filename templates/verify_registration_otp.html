<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Verify Email | Taxi Booking System
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }

        .otp-container {

            width: 420px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.25);
        }

        .logo {

            width: 65px;

            height: 65px;

            margin:
                0 auto 20px;

            background: #facc15;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;
        }

        h1 {

            text-align: center;

            color: #1e293b;

            margin-bottom: 10px;
        }

        .subtitle {

            text-align: center;

            color: #64748b;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        .email {

            font-weight: bold;

            color: #1e293b;
        }

        .form-group {

            margin-bottom: 20px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-weight: 600;

            font-size: 14px;
        }

        input {

            width: 100%;

            padding: 13px;

            border:
                1px solid #cbd5e1;

            border-radius: 9px;

            font-size: 20px;

            text-align: center;

            letter-spacing: 6px;

            outline: none;
        }

        input:focus {

            border-color: #facc15;

            box-shadow:
                0 0 0 3px
                rgba(250, 204, 21, 0.15);
        }

        .verify-btn {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 9px;

            background: #facc15;

            color: #1e293b;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .verify-btn:hover {

            background: #eab308;
        }

        .error {

            background: #fee2e2;

            color: #b91c1c;

            padding: 10px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 14px;

            text-align: center;
        }

        .back-link {

            text-align: center;

            margin-top: 20px;

            font-size: 14px;
        }

        .back-link a {

            color: #1e293b;

            font-weight: bold;

            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="otp-container">

    <div class="logo">
        ✉️
    </div>


    <h1>
        Verify Your Email
    </h1>


    <p class="subtitle">

        We sent a 6-digit OTP to

        <br>

        <span class="email">
            {{ email }}
        </span>

        <br>

        Enter the OTP below to complete
        your admin registration.

    </p>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label for="otp">
                Enter OTP
            </label>

            <input
                type="text"
                id="otp"
                name="otp"
                placeholder="000000"
                maxlength="6"
                pattern="[0-9]{6}"
                required
                autocomplete="one-time-code"
            >

        </div>


        <button
            type="submit"
            class="verify-btn"
        >
            Verify & Register
        </button>

    </form>


    <div class="back-link">

        <a href="{% url 'admin_register' %}">
            Back to Registration
        </a>

    </div>

</div>

</body>

</html>
