<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>
</head>
<body>

    <h2>Verify OTP</h2>

    <p>Enter the 6-digit OTP generated for your account.</p>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>OTP</label>

        <input
            type="text"
            name="otp"
            maxlength="6"
            placeholder="Enter OTP"
            required
        >

        <button type="submit">
            Verify OTP
        </button>
    </form>

</body>
</html>
